name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: 检查发布标签
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = 'v' + (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne $expected) { throw "标签必须与 VERSION 一致：$expected" }
      - name: 安装构建依赖
        run: python -m pip install -r requirements-build.txt
      - name: 静态检查
        run: python -m ruff check .
      - name: 格式检查
        run: python -m ruff format --check .
      - name: 编译、测试并打包
        run: python tools/build.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PBZHitEnhance-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: PBZHitEnhance-windows-x64
          path: dist
      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "PBZ Hit Enhance $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
